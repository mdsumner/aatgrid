name: pages

# Publishes the explorer at https://<owner>.github.io/aatgrid/explorer/
# with a redirect from the site root. When pkgdown is added, build it into
# _site here and drop the redirect; the explorer URL does not change.
#
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "explorer/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}explorer/
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/explorer
          cp explorer/index.html explorer/app.js explorer/utm.js _site/explorer/
          cp -r explorer/coast _site/explorer/coast
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=explorer/">
          <title>aatgrid</title>
          <a href="explorer/">aatgrid explorer</a>
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
